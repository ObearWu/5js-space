<script>
(function(){
'use strict';
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, '0');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const D = {
  t(s){ const [y,m,d] = s.split('-').map(Number); return Date.UTC(y, m-1, d); },
  s(t){ const x = new Date(t); return x.getUTCFullYear() + '-' + pad(x.getUTCMonth()+1) + '-' + pad(x.getUTCDate()); },
  add(s, n){ return D.s(D.t(s) + n * 864e5); },
  diff(a, b){ return Math.round((D.t(b) - D.t(a)) / 864e5); },
  today(){ const n = new Date(); return n.getFullYear() + '-' + pad(n.getMonth()+1) + '-' + pad(n.getDate()); },
  md(s){ const [,m,d] = s.split('-'); return (+m) + '/' + (+d); },
  wk(s){ return '日一二三四五六'[new Date(D.t(s)).getUTCDay()]; },
  long(s){ return D.md(s) + '（' + D.wk(s) + '）'; },
  ok(s){ return typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s); }
};
const mean = a => a.reduce((x, y) => x + y, 0) / a.length;
const uid8 = () => Math.random().toString(36).slice(2, 10);

const FLOW = ['沒有', '點狀', '少', '中', '多'];
const PAIN = ['不痛', '微痛', '會痛', '很痛'];
const SYM = ['脹氣', '胸部脹痛', '腰痠', '頭痛', '長痘痘', '疲倦', '嘴饞', '情緒起伏', '易怒', '失眠', '腹瀉', '便祕', '噁心', '分泌物變多'];
const PMS_SYM = new Set(['脹氣', '胸部脹痛', '腰痠', '頭痛', '長痘痘', '疲倦', '嘴饞', '情緒起伏', '易怒', '失眠']);
const MOOD = ['開心', '平靜', '敏感', '低落', '焦慮', '煩躁'];
const SHARE_ITEMS = [
  ['status', '經期狀態與倒數', '目前是經期第幾天、離下次還有幾天'],
  ['pms', 'PMS 期', '只告訴他現在是不是 PMS 期'],
  ['late', '晚來提醒', '預計日過了還沒來時，他也會看到'],
  ['calendar', '經期日曆', '過去與預測的經期日期'],
  ['symptoms', '經痛與症狀', '最近 7 天的經痛程度、經血量和症狀'],
  ['mood', '心情', '最近 7 天的心情'],
  ['diet', '飲食對照', '匯入的飲食熱量與糖分（最近 14 天）']
];

/* ---------- state ---------- */
const S = {
  mode: 'loading', db: null, user: null, uid: null, isOwner: false, readOnly: false,
  profile: null, logDocs: {}, diet: null, dsync: null, shared: [], names: {},
  view: 'today', calMode: 'month', calMonth: D.today().slice(0, 7), sheet: null, pendingRender: false, loaded: false
};
const DEFAULT_SETTINGS = { pmsDays: 7, lateDays: 3, share: {} };
function settings(){ return Object.assign({}, DEFAULT_SETTINGS, S.profile?.settings || {}, { share: Object.assign({}, S.profile?.settings?.share || {}) }); }
function logOf(date){ return S.logDocs['log-' + date.slice(0, 7)]?.days?.[date] || null; }
function dietSrc(){
  const a = S.diet?.days || {}, b = S.dsync?.days || {};
  if (!Object.keys(a).length && !Object.keys(b).length) return null;
  return { days: Object.assign({}, a, b), synced: !!Object.keys(b).length, syncedAt: S.dsync?.updated || null, importedAt: S.diet?.importedAt || null, profileName: S.dsync?.profileName || S.diet?.profileName || '' };
}
function allLogs(){ const o = {}; for (const k in S.logDocs) Object.assign(o, S.logDocs[k].days || {}); return o; }

/* ---------- cycle math ---------- */
function sortedPeriods(p){ return (p?.periods || []).filter(x => D.ok(x.start)).slice().sort((a, b) => a.start < b.start ? -1 : 1); }
function compute(p, today){
  today = today || D.today();
  const ps = sortedPeriods(p);
  const setup = p?.setup || { cycle: 28, period: 5 };
  const cycles = [];
  for (let i = 1; i < ps.length; i++){ const d = D.diff(ps[i-1].start, ps[i].start); if (d >= 15 && d <= 90) cycles.push({ start: ps[i-1].start, len: d }); }
  const recent = cycles.slice(-6).map(c => c.len);
  const avgCycle = recent.length ? Math.round(mean(recent)) : (+setup.cycle || 28);
  const lens = ps.filter(x => D.ok(x.end)).map(x => D.diff(x.start, x.end) + 1).filter(n => n >= 1 && n <= 15).slice(-6);
  const avgPeriod = lens.length ? Math.round(mean(lens)) : (+setup.period || 5);
  let sd = null;
  if (recent.length >= 3){ const m = mean(recent); sd = Math.sqrt(mean(recent.map(x => (x - m) ** 2))); }
  const last = ps[ps.length - 1] || null;
  const st = { ps, cycles, avgCycle, avgPeriod, sd, last, today };
  if (!last) return st;
  st.nextStart = D.add(last.start, avgCycle);
  st.cycleDay = D.diff(last.start, today) + 1;
  st.open = !last.end;
  st.inPeriod = last.end ? (today >= last.start && today <= last.end) : (st.cycleDay >= 1 && st.cycleDay <= 15);
  st.periodDay = st.inPeriod ? st.cycleDay : null;

}

  if (st.untilNext <= 0) return { k: 'late', label: st.late ? '晚了 ' + st.late + ' 天' : '預計今天來', cls: 'ph-late' };
  if (st.untilNext <= s.pmsDays) return { k: 'pms', label: 'PMS 期', cls: 'ph-pms' };
  const fromOvu = D.diff(st.ovu, st.today);
  if (fromOvu === 0) return { k: 'fertile', label: '預測排卵日', cls: 'ph-fertile' };

/* classify every day for the calendar */
function dayMap(p, s, from, to){
  const st = compute(p);
  const m = {};
  const mark = (d, k) => { if (d >= from && d <= to) (m[d] = m[d] || {})[k] = true; };
  const ps = st.ps;
  let lastActual = null;
  ps.forEach((x, i) => {
    let end = x.end;
    if (!end){
      end = D.add(x.start, 14); if (end > st.today) end = st.today;
      const guess = D.add(x.start, st.avgPeriod - 1);
      for (let d = D.add(st.today, 1); d <= guess; d = D.add(d, 1)) mark(d, 'pred');
    }
    for (let d = x.start; d <= end; d = D.add(d, 1)) mark(d, 'per');
    if (!lastActual || end > lastActual) lastActual = end;
    if (i > 0){
      for (let k = 1; k <= s.pmsDays; k++) mark(D.add(x.start, -k), 'pms');
      const ov = D.add(x.start, -14); mark(ov, 'ovu');
      for (let k = -5; k <= 1; k++) mark(D.add(ov, k), 'fer');
    }
  });
  if (st.last){
    for (let c = 0; c < 14; c++){
      const start = D.add(st.nextStart, c * st.avgCycle);
      if (D.add(start, st.avgCycle) < from) continue;
      if (start > to) break;
      for (let k = 0; k < st.avgPeriod; k++){ const d = D.add(start, k); if (d > lastActual && d > st.today) mark(d, 'pred'); }
      for (let k = 1; k <= s.pmsDays; k++){ const d = D.add(start, -k); if (d > lastActual) mark(d, 'pms'); }
      const ov = D.add(start, -14);
      if (ov > lastActual) mark(ov, 'ovu');
      for (let k = -5; k <= 1; k++){ const d = D.add(ov, k); if (d > lastActual) mark(d, 'fer'); }
    }
  }
  for (const d in m){ if (m[d].per || m[d].pred){ delete m[d].pms; delete m[d].fer; delete m[d].ovu; } else if (m[d].pms){ delete m[d].fer; delete m[d].ovu; } }
  return m;
}
function pmsSuggestion(p){
  const ps = sortedPeriods(p), logs = allLogs(), offs = [];
  ps.forEach((x, i) => {
    if (i === 0 && !logs[D.add(x.start, -1)] && !logs[D.add(x.start, -3)]) return;
    let far = 0;
    for (let k = 1; k <= 14; k++){ const l = logs[D.add(x.start, -k)]; if (l && ((l.sym || []).some(y => PMS_SYM.has(y)) || ['敏感', '低落', '焦慮', '煩躁'].includes(l.mood))) far = k; }
    if (far) offs.push(far);
  });
  if (offs.length < 2) return null;
  offs.sort((a, b) => a - b);
  return { days: Math.min(14, Math.max(2, offs[Math.floor(offs.length / 2)])), n: offs.length };
}

function writeDoc(name, data){

  const q = Q[path] || (Q[path] = { busy: false, next: null });

async function flush(path){
  const q = Q[path]; q.busy = true;

    const d = q.next; q.next = null;
    try { if (d === DEL) await S.db.doc(path).delete(); else await S.db.doc(path).set(d); }
    catch (e){ writeError(e); }

}

}

/* ---------- dial ---------- */
function dial(st, s){
  const total = Math.max(st.avgCycle, st.cycleDay || 0);
  const R = 92, C = 110, g = total > 40 ? 0.6 : 1.2;
  const ov = D.diff(st.last.start, st.ovu) + 1;
  const pl = st.last.end ? D.diff(st.last.start, st.last.end) + 1 : st.avgPeriod;
  let segs = '';
  for (let i = 1; i <= total; i++){
    let col = 'var(--line)';
    if (i <= pl) col = 'var(--rose)';
    else if (i > st.avgCycle) col = 'var(--amber)';
    else if (i > st.avgCycle - s.pmsDays) col = 'var(--lav)';
    else if (i >= ov - 5 && i <= ov + 1) col = 'var(--mint)';
    const a0 = (-90 + (i - 1) * 360 / total + g / 2) * Math.PI / 180, a1 = (-90 + i * 360 / total - g / 2) * Math.PI / 180;
    const x0 = C + R * Math.cos(a0), y0 = C + R * Math.sin(a0), x1 = C + R * Math.cos(a1), y1 = C + R * Math.sin(a1);
    segs += '<path d="M' + x0.toFixed(2) + ' ' + y0.toFixed(2) + ' A' + R + ' ' + R + ' 0 0 1 ' + x1.toFixed(2) + ' ' + y1.toFixed(2) + '" stroke="' + col + '" stroke-width="14" fill="none"/>';
  }
  const cd = Math.min(Math.max(st.cycleDay, 1), total);
  const am = (-90 + (cd - 0.5) * 360 / total) * Math.PI / 180;

  return '<svg viewBox="0 0 220 220" role="img" aria-label="本週期第 ' + st.cycleDay + ' 天，共約 ' + st.avgCycle + ' 天">' + segs +
    '<circle cx="' + mx.toFixed(1) + '" cy="' + my.toFixed(1) + '" r="11" fill="var(--surface)" stroke="var(--ink)" stroke-width="3"/></svg>';
}

    if (na > 2400) out.push({ cls: 'warn', t: '最近鹽分偏高', p: '平均每天鈉 ' + na.toLocaleString() + ' 毫克，超過國健署建議的每日上限 2,400 毫克（約 6 克鹽）。' + (pms ? '經前少吃鹹，比較不容易水腫、脹氣。' : '') + '外食可以請店家少放醬料，少點醃、燻、醬、滷的菜，湯少喝幾口；買包裝食品先看營養標示的鈉含量。', src: pms ? ['hpaSalt', 'nihPms'] : ['hpaSalt'] });

    if (wa !== null && wa < 1500) out.push({ cls: 'warn', t: '水喝得比較少', p: '有記錄的日子平均每天喝 ' + wa.toLocaleString() + ' 毫升。國健署新版每日飲食指南草案建議成年女性每天約 2,100 毫升液體，湯和無糖飲料也算。' + (per ? '經期多補充溫開水也比較舒服。' : '') + '可以在桌上放一個水壺，每小時喝幾口。', src: ['hpaWater'] });
    if (!out.length) out.push({ cls: 'good', t: '最近吃得很平衡', p: '鈉、糖分' + (wa !== null ? '、喝水量' : '') + (fe !== null ? '和鐵質' : '') + '都在建議範圍內，繼續保持。', src: fe !== null ? ['hpaSalt', 'whoDiet', 'ntuhIron'] : ['hpaSalt', 'whoDiet'] });
  }
  if (ph && ph.k === 'period'){
    if (typeof fe === 'undefined' || fe === null) out.push({ cls: 'phase', t: '經期記得補鐵', p: '19 到 50 歲女性每天建議攝取 15 毫克鐵。紅肉、魚和海鮮、豬血鴨血的鐵比較好吸收；深綠色蔬菜和豆類也有鐵，搭配芭樂、奇異果、草莓這類維生素 C 高的水果一起吃，吸收會更好。茶和咖啡會降低鐵的吸收，避免飯後馬上喝。', src: ['ntuhIron'] });
    const l0 = logOf(today), l1 = logOf(D.add(today, -1));

  } else if (ph && ph.k === 'pms'){

function dietCard(){

  const avg = (a, k) => a.length ? Math.round(mean(a.map(x => +x[k] || 0))) : null;

function partnerPhase(d){

function pickCare(list, n, seed, prefs){
  const no = prefList(prefs.dislikes), yes = prefList(prefs.likes);
  const ok = list.filter(x => !no.some(w => x.includes(w)));

  const f = root.querySelector('[autofocus]'); if (f) f.focus();
}
function dayStatus(date){
  const m = dayMap(S.profile, settings(), date, date)[date] || {};
  const st = compute(S.profile);
  const inP = st.ps.find(p => date >= p.start && date <= (p.end || D.add(p.start, 14)) && (p.end || date <= st.today));
  if (inP) return { txt: '經期第 ' + (D.diff(inP.start, date) + 1) + ' 天', p: inP };
  if (m.pred) return { txt: '預測經期' };
  if (m.pms) return { txt: 'PMS 期' };
  if (m.ovu) return { txt: '預測排卵日' };
  if (m.fer) return { txt: '易孕期' };
  return { txt: '' };
}

/* ---------- period actions ---------- */
function newPeriodOverlap(start, end, ignoreId){
  return S.profile.periods.find(p => p.id !== ignoreId && !(end && end < p.start) && !(start > (p.end || D.add(p.start, 14))));
}
function doStart(date){
  if (!D.ok(date) || date > D.today()) return toast('請選今天或之前的日期。');
  const ps = sortedPeriods(S.profile);
  const hit = ps.find(p => date >= p.start && date <= (p.end || (p === ps[ps.length - 1] ? D.today() : p.start)));
  if (hit && hit.start === date) return toast('這天已經是經期第一天了。');
  if (hit && hit.end) return toast('這天已經在 ' + D.md(hit.start) + ' 開始的經期裡。要調整請按「修改」。');
  const prev = ps.filter(p => p.start < date).pop();
  if (prev && !prev.end){
    if (D.diff(prev.start, date) < 15) return toast(D.md(prev.start) + ' 開始的經期還沒記錄結束日，請先記錄結束日。', 5000);
    S.profile.periods.find(x => x.id === prev.id).end = D.add(prev.start, Math.min(compute(S.profile).avgPeriod, D.diff(prev.start, date)) - 1);
  }
  const next = ps.find(p => p.start > date);
  if (next && D.diff(date, next.start) < 15) return toast('離 ' + D.md(next.start) + ' 那次太近了，請到「統計」修改那筆紀錄。');
  S.profile.periods.push({ id: uid8(), start: date, end: null });
  saveProfile();
  toast('已記錄 ' + D.md(date) + ' 是第一天，預測已更新。');
}
function doEnd(date){
  if (!D.ok(date) || date > D.today()) return toast('請選今天或之前的日期。');
  const ps = sortedPeriods(S.profile);
  const p = ps.filter(x => x.start <= date && D.diff(x.start, date) <= 15).pop();
  if (!p) return toast('這天前 15 天內沒有經期開始的紀錄，請先記錄第一天。');
  const orig = S.profile.periods.find(x => x.id === p.id);
  orig.end = date;
  saveProfile();
  toast('已記錄 ' + D.md(date) + ' 結束，這次共 ' + (D.diff(p.start, date) + 1) + ' 天。');
}

/* ---------- diet import ---------- */
async function readDiet(file){
  let data;
  try { data = JSON.parse(await file.text()); } catch (e) { return toast('這個檔案讀不出來，請選大小豬健康食記的備份檔（.json）。', 5000); }
  if (data?.app !== 'dxz-food-log' || !Array.isArray(data.meals)) return toast('這不是大小豬健康食記的備份檔。', 5000);
  const profiles = (data.profiles || []).filter(p => p && p.id);
  if (!profiles.length) return toast('備份檔裡沒有使用者資料。');
  const mine = profiles.filter(p => /^(f|female|女)/i.test(String(p.sex || p.gender || '')));
  if (profiles.length === 1) return importDiet(data, profiles[0]);
  openSheet({ type: 'dietPick', data, profiles: mine.length ? mine.concat(profiles.filter(p => !mine.includes(p))) : profiles });
}
function importDiet(data, prof){
  const days = {};
  const add = (d, k, v) => { if (!D.ok(d) || !(v > 0)) return; (days[d] = days[d] || { kcal: 0, sugar: 0, sodium: 0, water: 0 })[k] += v; };
  (data.meals || []).filter(m => m.profileId === prof.id).forEach(m => { const t = m.totals || {}; add(m.date, 'kcal', +t.kcal || 0); add(m.date, 'sugar', +t.sugar || 0); add(m.date, 'sodium', +t.sodium || 0); });
  (data.water || []).filter(w => w.profileId === prof.id).forEach(w => { const ml = +w.ml || +w.amount || +w.cc || (+w.cups ? w.cups * 250 : 0); add(w.date, 'water', ml); });
  const ds = Object.keys(days).sort();
  if (!ds.length) return toast('備份檔裡沒有 ' + (prof.name || '這位使用者') + ' 的飲食紀錄。', 5000);
  const cut = D.add(ds[ds.length - 1], -365), kept = {};
  ds.filter(d => d >= cut).forEach(d => { const v = days[d]; kept[d] = { kcal: Math.round(v.kcal), sugar: Math.round(v.sugar * 10) / 10, sodium: Math.round(v.sodium), water: Math.round(v.water) }; });
  S.diet = { importedAt: Date.now(), profileName: String(prof.name || '').slice(0, 40), days: kept };
  writeDoc('diet', S.diet); scheduleShare();
  closeSheet(); render();
  toast('已匯入 ' + Object.keys(kept).length + ' 天的飲食資料。');
}

/* ---------- calendar file ---------- */
function icsFile(){
  const st = compute(S.profile), s = settings();
  const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
  const dv = d => d.replace(/-/g, '');
  const ev = (d, title, desc, k) => ['BEGIN:VEVENT', 'UID:ptk-' + k + '-' + dv(d) + '@period-diary', 'DTSTAMP:' + stamp, 'DTSTART;VALUE=DATE:' + dv(d), 'DTEND;VALUE=DATE:' + dv(D.add(d, 1)), 'SUMMARY:' + title, 'DESCRIPTION:' + desc, 'TRANSP:TRANSPARENT',
    'BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:' + title, 'TRIGGER:PT9H', 'END:VALARM', 'END:VEVENT'].join('\r\n');
  const out = [];
  for (let c = 0; c < 3; c++){
    const start = D.add(st.nextStart, c * st.avgCycle);
    if (start >= D.today()) out.push(ev(start, '預計經期第一天', '有來的話記得打開小豬經期日記記錄', 'p' + c));
    const pms = D.add(start, -s.pmsDays); if (pms > D.today()) out.push(ev(pms, 'PMS 期開始', '接下來幾天身體和情緒可能比較敏感', 'm' + c));
  }
  const lateDay = D.add(st.nextStart, s.lateDays);
  if (lateDay >= D.today()) out.push(ev(lateDay, '月經還沒來嗎？', '已經比預計晚 ' + s.lateDays + ' 天。如果已經來了，請刪除這則提醒並打開小豬經期日記補記第一天。', 'l0'));
  return ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//period-diary//ZH-TW', 'CALSCALE:GREGORIAN', 'X-WR-CALNAME:小豬經期日記'].concat(out, ['END:VCALENDAR']).join('\r\n');
}
async function save(filename, data, type){
  const dl = window.claude ? await window.claude.use('downloads').catch(() => null) : null;
  try {
    if (dl) await dl.save({ filename, data: new Blob([data], { type }) });
    else { const u = URL.createObjectURL(new Blob([data], { type })); const a = document.createElement('a'); a.href = u; a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 4000); }
    return true;
  } catch (e) { if (e?.code !== 'declined') toast(e?.code === 'rate_limited' ? '已經有一個下載視窗開著，請先處理它。' : '這裡無法下載檔案。'); return false; }
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, v = b.dataset.v;
  if (a === 'scrim'){ if (e.target === b) closeSheet(); return; }
  if (S.readOnly && ['setup', 'doStart', 'doEnd', 'dsave', 'dclear', 'savePeriod', 'delPeriod', 'share', 'step', 'saveSetup', 'usePms', 'markStart', 'markEnd'].includes(a)){ toast('你的權限只能看，無法修改。'); return; }
  switch (a){
    case 'tab': S.view = v; render(); window.scrollTo(0, 0); break;
    case 'setup': {
      const start = $('#su-start').value, cyc = Math.min(60, Math.max(18, +$('#su-cycle').value || 28)), per = Math.min(12, Math.max(2, +$('#su-period').value || 5));
      if (!D.ok(start) || start > D.today()) return toast('請選最近一次月經的第一天。');
      const end = D.add(start, per - 1);
      S.profile = { v: 1, setup: { cycle: cyc, period: per }, settings: { pmsDays: 7, lateDays: 3, share: Object.fromEntries(SHARE_ITEMS.map(x => [x[0], true])) }, periods: [{ id: uid8(), start, end: end < D.today() ? end : null }] };
      S.view = 'today'; saveProfile(); toast('設定完成！'); break; }

    case 'endSheet': openSheet({ type: 'end' }); break;
    case 'doStart': { const d = $('#mk-date').value; closeSheet(); doStart(d); break; }
    case 'doEnd': { const d = $('#mk-date').value; closeSheet(); doEnd(d); break; }
    case 'markStart': closeSheet(); doStart(b.dataset.d); break;
    case 'markEnd': closeSheet(); doEnd(b.dataset.d); break;
    case 'day': { const d = b.dataset.d, l = logOf(d); openSheet({ type: 'day', date: d, draft: l ? JSON.parse(JSON.stringify(l)) : { sym: [] } }); break; }
    case 'dset': S.sheet.draft[b.dataset.k] = +v; S.sheet.draft.note = $('#d-note')?.value || ''; renderSheet(); break;
    case 'dsym': { const dr = S.sheet.draft; dr.sym = dr.sym || []; dr.sym = dr.sym.includes(v) ? dr.sym.filter(x => x !== v) : dr.sym.concat(v); dr.note = $('#d-note')?.value || ''; renderSheet(); break; }
    case 'dmood': { const dr = S.sheet.draft; dr.mood = dr.mood === v ? '' : v; dr.note = $('#d-note')?.value || ''; renderSheet(); break; }
    case 'dsave': {
      const dr = S.sheet.draft; dr.note = ($('#d-note')?.value || '').trim().slice(0, 300);
      const e2 = { flow: dr.flow || 0, pain: dr.pain || 0, sym: dr.sym || [], mood: dr.mood || '', note: dr.note, t: Date.now() };
      const empty = !e2.flow && !e2.pain && !e2.sym.length && !e2.mood && !e2.note;
      const d = S.sheet.date; closeSheet(); saveLog(d, empty ? null : e2); toast(empty ? '這天沒有記錄任何內容。' : '已儲存 ' + D.md(d) + ' 的紀錄。'); break; }
    case 'dclear': { const d = S.sheet.date; closeSheet(); saveLog(d, null); toast('已清除。'); break; }
    case 'close': closeSheet(); break;
    case 'careShuffle': S.careShuffle = (S.careShuffle || 0) + 1; try { localStorage.removeItem(careAiKey(S.shared[0]?.id)); } catch (e) {} render(); break;
    case 'careAI': careAI(v); break;
    case 'carePrefs': openSheet({ type: 'carePrefs' }); break;
    case 'carePrefsSave': { S.care = { likes: $('#cp-likes').value.trim(), dislikes: $('#cp-dislikes').value.trim(), updated: Date.now() }; writeDoc('care', S.care); closeSheet(); render(); toast('已儲存口味偏好。'); break; }
    case 'login': loginFlow(false); break;
    case 'retryLogin': closeSheet(); loginFlow(true); break;

    case 'confirmYes': { const r = S.sheet.run; closeSheet(); r(); break; }

    case 'ics': save('小豬經期提醒.ics', icsFile(), 'text/calendar').then(ok => ok && toast('下載後打開檔案，就能加到行事曆。', 5000)); break;
    case 'dietImport': $('#dietFile').click(); break;
    case 'periodImport': $('#periodFile').click(); break;
    case 'dietPick': importDiet(S.sheet.data, S.sheet.profiles[+v]); break;
    case 'dietClear': openSheet({ type: 'confirm', title: '刪除飲食資料？', text: '只會刪除這裡匯入的副本，大小豬健康食記裡的紀錄不受影響。', yes: '刪除', danger: true, run: () => { S.diet = null; writeDoc('diet', DEL); scheduleShare(); render(); toast('已刪除飲食資料。'); } }); break;
    case 'export': save('小豬經期日記備份_' + D.today() + '.json', JSON.stringify({ app: 'period-diary', version: 1, exported: new Date().toISOString(), profile: S.profile, logs: allLogs(), diet: S.diet }, null, 1), 'application/json'); break;
  }
});
document.addEventListener('focusout', () => { setTimeout(() => { if (S.pendingRender && !(document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))) render(); }, 0); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.sheet) closeSheet(); });
$('#dietFile').addEventListener('change', e => { const f = e.target.files?.[0]; e.target.value = ''; if (f) readDiet(f); });
$('#periodFile').addEventListener('change', e => { const f = e.target.files?.[0]; e.target.value = ''; if (f) importPeriodBackup(f); });

/* ---------- 匯入舊「小豬經期日記」的備份（合併，不刪除） ---------- */
async function importPeriodBackup(file){
  let data;
  try { data = JSON.parse(await file.text()); } catch (e) { return toast('這個檔案讀不出來，請選小豬經期日記的備份檔（.json）。', 5000); }
  if (data?.app !== 'period-diary' || !data.profile || !Array.isArray(data.profile.periods)) return toast('這不是小豬經期日記的備份檔。', 5000);
  if (S.mode !== 'cloud') return toast('連上雲端後才能匯入。');
  const cur = S.profile ? JSON.parse(JSON.stringify(S.profile)) : null;
  const base = cur || { v: 1, setup: data.profile.setup || { cycle: 28, period: 5 }, settings: data.profile.settings || { pmsDays: 7, lateDays: 3, share: {} }, periods: [] };
  const have = new Set(base.periods.map(p => p.start));
  let addedP = 0;
  data.profile.periods.filter(p => p && D.ok(p.start)).forEach(p => {
    if (have.has(p.start)) return;
    base.periods.push({ id: p.id || uid8(), start: p.start, end: D.ok(p.end) ? p.end : null }); have.add(p.start); addedP++;
  });
  S.profile = base; saveProfile();
  const logs = data.logs && typeof data.logs === 'object' ? data.logs : {};
  const byMonth = {};
  let addedL = 0;
  for (const d in logs){ if (!D.ok(d) || !logs[d] || logOf(d)) continue; (byMonth['log-' + d.slice(0, 7)] = byMonth['log-' + d.slice(0, 7)] || {})[d] = logs[d]; addedL++; }
  for (const k in byMonth){
    const doc = S.logDocs[k] ? JSON.parse(JSON.stringify(S.logDocs[k])) : { days: {} };
    doc.days = Object.assign({}, byMonth[k], doc.days || {});
    S.logDocs[k] = doc; writeDoc(k, doc);
  }
  if (data.diet && data.diet.days && !S.diet){ S.diet = data.diet; writeDoc('diet', S.diet); }
  scheduleShare(); render();
  toast('匯入完成：新增 ' + addedP + ' 次經期、' + addedL + ' 天的身體紀錄。', 6000);
}

/* ---------- 飲食對照：直接讀飲食頁（/food）的紀錄 ---------- */
function watchFoodDiet(db, id){
  const base = 'data/users/' + id;
  let profiles = [], meals = [], water = [];
  const recompute = () => {
    const prof = profiles.find(p => p.sex === 'F') || profiles[0];
    const days = {};
    const add = (d, k, v) => { if (!D.ok(d) || !(v > 0)) return; const o = days[d] = days[d] || { kcal: 0, sugar: 0, sodium: 0, water: 0 }; o[k] = (o[k] || 0) + v; };
    if (prof){
      meals.filter(m => m.profileId === prof.id).forEach(m => { const t = m.totals || {}; ['kcal', 'sugar', 'sodium', 'iron'].forEach(k => add(m.date, k, +t[k] || 0)); });
      water.filter(w => w.profileId === prof.id).forEach(w => add(w.date, 'water', +w.ml || 0));
    }
    for (const d in days){ const v = days[d]; v.kcal = Math.round(v.kcal); v.sugar = Math.round(v.sugar * 10) / 10; v.sodium = Math.round(v.sodium); v.water = Math.round(v.water); if (typeof v.iron === 'number') v.iron = Math.round(v.iron * 10) / 10; }
    S.dsync = Object.keys(days).length ? { days, updated: Date.now(), profileName: String(prof?.name || '') } : null;
    if (!S.sheet) render(); else S.pendingRender = true;
  };
  const list = snap => snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
  db.unprefixed.collection(base + '/profiles/list').onSnapshot(s => { profiles = list(s); recompute(); }, () => {});
  db.unprefixed.collection(base + '/meals/list').where('date', '>=', D.add(D.today(), -365)).onSnapshot(s => { meals = list(s); recompute(); }, () => {});
  db.unprefixed.collection(base + '/water/list').where('date', '>=', D.add(D.today(), -365)).onSnapshot(s => { water = list(s); recompute(); }, () => {});
}

/* ---------- boot ---------- */
async function connectCloud(){
  const C = window.claude;
  let db = null, user = null;
  if (C && C.use){ try { [db, user] = await Promise.all([C.use('db'), C.use('user')]); } catch (e) {} }
  const id = user ? await user.id() : null;
  S.isOwner = user ? await user.isOwner() : false;
  if (!(db && id)) return false;
  const local = S.mode === 'local' && S.profile ? { profile: S.profile, logDocs: S.logDocs, diet: S.diet } : null;
  S.loaded = false; S.profile = null; S.logDocs = {}; S.diet = null;
  {
    S.mode = 'cloud'; S.db = db; S.uid = id; S.user = user;
    let first = true;
    db.collection('data/users/' + id).onSnapshot(snap => {
      const logDocs = {}; let prof = null, diet = null;
      snap.docs.forEach(d => { const x = d.data(); if (!x) return; if (d.id === 'profile') prof = x; else if (d.id === 'care') S.care = x; else if (d.id === 'diet') diet = x; else if (d.id.startsWith('log-')) logDocs[d.id] = x; });
      S.profile = prof ? JSON.parse(JSON.stringify(prof)) : null;
      S.logDocs = JSON.parse(JSON.stringify(logDocs)); S.diet = diet;
      if (first && (!snap.metadata.fromCache || snap.size)){ first = false; S.loaded = true; scheduleShare();
        if (local && !S.profile){ S.sheet = { type: 'migrate', local }; renderSheet(); } }
      if (!S.sheet) render(); else S.pendingRender = true;
    }, err => { toast('雲端連線中斷，請重新整理頁面。', 6000); });
    {
      db.collection('share').onSnapshot(async snap => {
        S.shared = snap.docs.filter(d => d.id !== id && d.data()).map(d => ({ id: d.id, data: d.data() }));
        if (S.shared.length){ try { const ps = await user.profiles(S.shared.map(x => x.id)); for (const k in ps) if (ps[k].name) S.names[k] = ps[k].name; } catch (e) {} }
        if (S.shared.length && !S.profile && S.view !== 'partner') S.view = 'partner';
        if (!S.sheet) render();
      }, () => {});
    }
    watchFoodDiet(db, id);
    db.doc('share/' + id).get().then(d => { lastShare = sigOf(d.exists ? d.data() : null); scheduleShare(); }).catch(() => { lastShare = null; });
  }
  render();
  return true;
}
async function loginFlow(retry){
  if (S.connecting) return;
  S.connecting = true; render();
  const C = window.claude;
  const pm = C && C.use ? await C.use('permissions').catch(() => null) : null;
  if (pm){
    try {
      const st = await pm.state();
      const need = ['db', 'user'].filter(k => st[k] === 'prompt');
      if (need.length) await pm.request(need);
    } catch (e) {}
  }
  const ok = await connectCloud();
  S.connecting = false; render();
  if (ok) toast('已連上雲端。');
  else openSheet({ type: 'login' });
}
async function boot(){
  const ok = await connectCloud();
  if (!ok){ S.mode = 'local'; localLoad(); S.loaded = true; render(); }
}
render();
boot();
})();

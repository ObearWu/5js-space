<!doctype html>
<html lang="zh-Hant" data-mod="hq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>大小豬的小空間</title>
<meta name="theme-color" content="#15102A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="大小豬">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Huninn&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="common/style.css">
<script src="https://accounts.google.com/gsi/client" async></script>
<style>
.page{max-width:720px}
body.locked .tabbar{display:none}
.gate{max-width:440px;width:100%;margin:10vh auto 0;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
.gate .pigs .lollipop{width:110px;height:110px}
.gate h2{font-size:1.5rem}
#googleBtn{min-height:44px}

.hqhead{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-top:18px;flex-wrap:wrap}
.hqhead h1{font-size:1.35rem}
.hqhead p{margin:0;font-size:.85rem;color:var(--muted)}

/* 核心記憶 */
.core{display:flex;align-items:center;gap:14px;border-color:color-mix(in srgb,var(--gold) 45%,transparent);
  box-shadow:0 0 34px color-mix(in srgb,var(--gold) 16%,transparent),0 10px 30px var(--shadow);text-decoration:none;color:inherit}
.core .pigs .lollipop{width:68px;height:68px}
.core .k{font-size:.75rem;letter-spacing:.08em;color:var(--gold)}
.core b{display:block;font-family:var(--f-round);font-weight:400;font-size:1.25rem;color:#FFE59A;line-height:1.35}
.core b .num{font-size:1.6rem;margin:0 3px}
.core span.s{font-size:.88rem;color:var(--muted)}

/* 通知設定 */
.notif h2{font-size:1rem;margin-bottom:8px}
.notif .rows{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.notif label{display:flex;align-items:center;gap:8px;font-size:.92rem}
.notif label input{width:18px;height:18px;accent-color:var(--gold)}
.notif .acts{display:flex;gap:8px;flex-wrap:wrap}
.notif p{margin:0;font-size:.85rem}
.notif .sep{border:0;border-top:1px solid var(--line,rgba(255,255,255,.12));margin:14px 0}

/* 想你 */
.pingbar{display:flex;align-items:center;gap:12px;padding:12px 16px}
.pingbar .t{flex:1;min-width:0;font-size:.9rem}
.pingbar .t b{display:block;font-family:var(--f-round);font-weight:400;font-size:1.05rem}
.pingbar .heart{border:0;cursor:pointer;width:46px;height:46px;border-radius:50%;font-size:1.3rem;color:#fff;flex:none;
  background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.6) 0 8%,transparent 30%),var(--emb);box-shadow:0 0 16px color-mix(in srgb,var(--emb) 55%,transparent)}
.pingbar .heart:active{transform:scale(.9)}
.pingbar.got{border-color:var(--emb);box-shadow:0 0 30px color-mix(in srgb,var(--emb) 40%,transparent),0 10px 30px var(--shadow)}
.pingbar.got .heart{animation:pulse 1.8s ease-in-out infinite}

/* 我們這週（週日）、我們的一年（12 月） */
.weekcard h2{font-size:1rem;margin-bottom:10px}
.weekcard .g{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.weekcard .g div{background:var(--sunk);border-radius:14px;padding:10px 12px;display:flex;gap:10px;align-items:center;min-width:0}
.weekcard .g .orb{--s:26px}
.weekcard .g b{display:block;font-family:var(--f-num);font-size:1.15rem}
.weekcard .g small{color:var(--muted);font-size:.76rem;display:block}
.weekcard p{margin:10px 0 0;font-size:.85rem}
.agenda h2{font-size:1rem;margin-bottom:8px}
.agenda ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.agenda a{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;background:var(--sunk);border-radius:14px;padding:9px 12px;min-width:0}
.agenda .orb{--s:22px;flex:none}
.agenda .t{flex:1;min-width:0;font-size:.92rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.agenda .t small{display:block;color:var(--muted);font-size:.76rem}
.agenda .n{flex:none;font-family:var(--f-num);font-size:.95rem;text-align:right}
.yearcard{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit;border-color:color-mix(in srgb,var(--gold) 55%,transparent);box-shadow:0 0 30px color-mix(in srgb,var(--gold) 22%,transparent),0 10px 30px var(--shadow)}
.yearcard .orb{--s:44px}
.yearcard b{display:block;font-family:var(--f-round);font-weight:400;font-size:1.15rem;color:#FFE59A}
.yearcard span.s{font-size:.85rem;color:var(--muted)}

/* 控制台 */
.console{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px 10px;padding:22px 12px}
.console a{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;text-decoration:none;color:inherit;border-radius:18px;padding:6px 2px;min-width:0}
.console a:hover .orb,.console a:focus-visible .orb{transform:scale(1.06)}
.console .orb{--s:64px;transition:transform .15s}
.console b{font-family:var(--f-round);font-weight:400;font-size:1rem}
.console small{font-size:.78rem;color:var(--muted);line-height:1.35;min-height:2.7em;overflow-wrap:anywhere}
.console a.hot small{color:#fff;font-weight:700}

/* 記憶架 */
.shelf h2{font-size:1rem;margin-bottom:10px}
.shelf .row{display:grid;grid-template-columns:3.2em repeat(14,minmax(0,1fr));gap:4px;align-items:center;padding:6px 0;border-bottom:3px solid rgba(255,255,255,.1)}
.shelf .row + .row{margin-top:4px}
.shelf .nm{font-size:.8rem;color:var(--muted)}
.shelf .orb{--s:100%;aspect-ratio:1;height:auto;max-width:22px;justify-self:center}
.shelf .days{display:grid;grid-template-columns:3.2em repeat(14,minmax(0,1fr));gap:4px;font-size:.62rem;color:var(--muted);text-align:center;margin-top:4px}
.shelf .legend{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:10px;font-size:.75rem;color:var(--muted)}
.shelf .legend span{display:inline-flex;align-items:center;gap:4px}
.shelf .legend .orb{--s:10px;box-shadow:none}
</style>
<script src="common/lock.js"></script>
</head>
<body class="locked">
<div class="page">
  <section class="gate" id="gate" hidden>
    <span class="pigs" id="gatePigs"></span>
    <h2>大小豬的小空間</h2>
    <p class="muted">這裡是大豬和小豬的總部，只有你們兩個人能進來，請用 Google 帳號登入。</p>
    <div id="googleBtn"></div>
    <p class="msg" id="gateMsg" hidden></p>
  </section>

  <main id="hub" hidden style="display:flex;flex-direction:column;gap:18px">
    <header class="hqhead">
      <div><h1 id="helloTitle"></h1><p id="helloDate"></p></div>
      <div><span class="small muted" id="accountName"></span> <button class="btn ghost" type="button" id="notifBtn" aria-expanded="false">設定</button> <button class="btn ghost" type="button" id="logoutBtn">登出</button></div>
    </header>

    <a class="panel core" href="together/#days" id="core">
      <span class="pigs" id="corePigs"></span>
      <span><span class="k">核心記憶</span><b id="coreTitle">我們的小空間</b><span class="s" id="coreSub"></span></span>
    </a>

    <section class="panel notif" id="notif" hidden aria-labelledby="notifTitle"></section>
    <section class="panel pingbar" id="pingbar" hidden aria-label="想你"></section>
    <a class="panel yearcard" id="yearCard" hidden></a>
    <section class="panel weekcard" id="weekCard" hidden aria-labelledby="wkTitle"></section>
    <section class="panel agenda" id="agendaCard" hidden aria-labelledby="agTitle"></section>

    <nav class="panel console" id="console" aria-label="功能"></nav>

    <section class="panel shelf" aria-labelledby="shelfTitle">
      <h2 id="shelfTitle">記憶架・最近兩週的心情</h2>
      <div id="shelf"><p class="small muted">讀取中…</p></div>
    </section>
  </main>

  <p class="loading" id="booting"><span class="spinner"></span><span id="bootMsg">讀取中…</span></p>
</div>

<script src="common/config.js"></script>
<script src="common/auth.js"></script>
<script src="common/mascot.js"></script>
<script src="common/hq.js"></script>
<script>
(() => {
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = n => "$" + Math.round(n).toLocaleString("en-US");

// 首頁控制台的功能球：照片牆是互動頁的一區，單獨給一顆球
const CONSOLE = [
  { key: "food", name: "飲食", href: "food/", color: "var(--joy)" },
  { key: "split", name: "記帳", href: "split/", color: "var(--disgust)" },
  { key: "period", name: "經期", href: "period/", color: "var(--emb)" },
  { key: "together", name: "互動", href: "together/", color: "var(--sad)" },
  { key: "fitness", name: "運動", href: "fitness/", color: "var(--anger)" },
  { key: "photos", name: "照片牆", href: "together/#photos", color: "var(--envy)" },
];
const READY = new Set(FiveJS.MODS.map(m => m.key));

const tz = { timeZone: "Asia/Taipei" };
function greeting() {
  const h = Number(new Intl.DateTimeFormat("en-US", { ...tz, hour: "numeric", hour12: false }).format(new Date()));
  return h < 5 ? "還沒睡呀" : h < 11 ? "早安" : h < 14 ? "午安" : h < 18 ? "下午好" : "晚安";
}
const todayText = () => new Intl.DateTimeFormat("zh-TW", { ...tz, month: "long", day: "numeric", weekday: "long" }).format(new Date());
function pigs(el, me, partner, size) {
  const a = me?.theme || "blue", b = partner?.theme || (a === "blue" ? "pink" : "blue");
  el.innerHTML = FiveJS.lollipop(a, "happy", size) + FiveJS.lollipop(b, "wave", Math.round(size * .82));
}

let ME = null;
const nameOf = id => +id === ME.user.id ? ME.user.name : ME.partner && +id === ME.partner.id ? ME.partner.name : "?";

// 每顆球底下的一行狀態；hot=true 的球會輕輕閃（有事等你處理）
function statusOf(key, s) {
  const me = ME.user, pa = ME.partner;
  if (!s) return { text: "" };
  if (key === "food") {
    const n = s.food[me.id] || 0, m = pa ? s.food[pa.id] || 0 : 0;
    return { text: (n ? `今天 ${n} 餐` : "今天還沒記") + (m ? `・${pa.name} ${m} 餐` : "") };
  }
  if (key === "split") {
    // 前半是自己的記帳（只有本人看得到），後半是兩人的分帳
    const lg = s.ledger || {};
    const evening = +new Intl.DateTimeFormat("en-US", { timeZone: "Asia/Taipei", hour: "numeric", hourCycle: "h23" }).format(new Date()) >= 20;
    const own = lg.needLeft == null ? "" : lg.needLeft < 0 ? `必要支出超出 ${money(-lg.needLeft)}` : `還能花 ${money(lg.needLeft)}`;
    const mine = +(s.split.balance[me.id] || 0);
    const shared = s.split.active_trip ? `${s.split.active_trip.name}進行中` : !pa || !mine ? "" : mine > 0 ? `${pa.name}要給你 ${money(mine)}` : `你要給${pa.name} ${money(-mine)}`;
    if (evening && !lg.recordedToday) return { text: ["今天還沒記帳", shared].filter(Boolean).join("・"), hot: true };
    return { text: [own, shared].filter(Boolean).join("・") || "目前兩清", hot: lg.warn };
  }
  if (key === "period") {
    if (!s.period.length) return { text: "記錄週期" };
    return { text: s.period.map(p => {
      const who = +p.user_id === me.id ? "" : nameOf(p.user_id);
      const txt = p.state === "in" ? `${who}經期第 ${p.day} 天` : p.state === "late" ? `${who}晚了 ${p.days} 天` : p.days === 0 ? `${who}預計今天` : `${who}還有 ${p.days} 天`;
      // 給看對方狀態的人一句陪伴提示（只出現在另一半的首頁，跟經期頁的「今天怎麼陪她」一致）
      const hint = !who ? "" : p.state === "in" ? (p.day <= 2 ? "幫她準備熱的" : "陪她輕鬆過") : p.state === "late" ? "先關心她" : p.pms ? "多點耐心" : "";
      return txt + (hint ? `，${hint}` : "");
    }).join("・") };
  }
  if (key === "together") {
    const a = s.together.answered, mine = a[me.id], theirs = pa && a[pa.id];
    const lm = s.together.lovemap || {}, ck = s.together.checkin || {};
    const sunday = new Date(s.today + "T00:00:00").getDay() === 0;
    if (pa && s.together.ping?.unseen) return { text: `${pa.name}想你了 ♥`, hot: true };
    if (pa && sunday && !ck[me.id]) return { text: ck[pa.id] ? `${pa.name}寫好週日小聊天了` : "今天是週日小聊天", hot: true };
    if (pa && lm[pa.id] && !lm[me.id] && (!theirs || mine)) return { text: `${pa.name}猜好了，換你猜`, hot: true };
    if (theirs && !mine) return { text: `${pa.name}答了！換你`, hot: true };
    if (mine && !theirs && pa) return { text: `等${pa.name}回答` };
    if (mine && theirs) return { text: "今天都答了" };
    return { text: "今天的問題來了", hot: true };
  }
  if (key === "fitness") {
    const n = s.fitness[me.id] || 0, m = pa ? s.fitness[pa.id] || 0 : 0;
    return { text: `這週 ${n} 天` + (m ? `・${pa.name} ${m} 天` : "") };
  }
  if (key === "photos") return { text: s.photos ? `${s.photos} 顆回憶` : "放第一張照片" };
  return { text: "" };
}

function renderConsole(s) {
  $("console").innerHTML = CONSOLE.filter(m => READY.has(m.key) || m.key === "photos").map(m => {
    const st = statusOf(m.key, s);
    return `<a href="${m.href}" class="${st.hot ? "hot" : ""}"><i class="orb${st.hot ? " pulse" : ""}" style="--c:${m.color}"></i><b>${m.name}</b><small>${esc(st.text) || "&nbsp;"}</small></a>`;
  }).join("");
}

function renderCore(s) {
  const t = s?.together;
  if (t?.days_together) $("coreTitle").innerHTML = `在一起第<span class="num">${t.days_together.toLocaleString("en-US")}</span>天`;
  else $("coreTitle").textContent = "我們的小空間";
  const nd = t?.next_date;
  $("coreSub").textContent = nd ? (nd.days === 0 ? `今天是${nd.title} 🎉` : `${nd.title}還有 ${nd.days} 天`)
    : t?.days_together ? "" : "到互動頁新增在一起的日子";
}

function renderShelf(s) {
  const people = [ME.user, ME.partner].filter(Boolean);
  const days = [];
  for (let k = 13; k >= 0; k--) {
    const d = new Date(s.today + "T00:00:00"); d.setDate(d.getDate() - k);
    days.push(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`);
  }
  const by = {}; s.moods.forEach(m => { by[`${m.user_id}|${m.date}`] = m.mood; });
  if (!s.moods.length) { $("shelf").innerHTML = `<p class="small muted">還沒有心情紀錄。到<a href="together/">互動</a>打個卡，記憶球就會收進這裡。</p>`; return; }
  const rows = people.map(p => `<div class="row"><span class="nm">${esc(p.name)}</span>${days.map(d => {
    const m = by[`${p.id}|${d}`];
    return m ? `<i class="orb" style="--c:${FiveJS.MOOD_COLOR[m] || "var(--muted)"}" title="${d.slice(5)} ${esc(m)}"></i>` : `<i class="orb empty" title="${d.slice(5)}"></i>`;
  }).join("")}</div>`).join("");
  const labels = `<div class="days"><span></span>${days.map((d, i) => `<span>${i % 2 === 1 ? +d.slice(8) : ""}</span>`).join("")}</div>`;
  const legend = `<div class="legend">${Object.entries(FiveJS.MOOD_COLOR).map(([k, c]) => `<span><i class="orb" style="--c:${c}"></i>${k}</span>`).join("")}</div>`;
  $("shelf").innerHTML = rows + labels + legend;
}

// 週日的「我們這週」：兩人這週吃了幾餐、運動幾天、一起答了幾題；錢只顯示自己存的
function renderWeek(s) {
  const el = $("weekCard"), w = s.week;
  const sunday = new Date(s.today + "T00:00:00").getDay() === 0;
  if (!w || !(sunday || new URLSearchParams(location.search).has("week"))) { el.hidden = true; return; }
  const me = ME.user, pa = ME.partner;
  const both = (o, unit) => `${o[me.id] || 0}${pa ? ` / ${o[pa.id] || 0}` : ""} ${unit}`;
  el.hidden = false;
  el.innerHTML = `<h2 id="wkTitle">我們這週・${+w.from.slice(5, 7)}/${+w.from.slice(8)} 起</h2>
    <div class="g">
      <div><i class="orb" style="--c:var(--joy)"></i><span><b>${both(w.meals, "餐")}</b><small>記錄的餐點${pa ? `（${esc(me.name)} / ${esc(pa.name)}）` : ""}</small></span></div>
      <div><i class="orb" style="--c:var(--anger)"></i><span><b>${both(w.fitness, "天")}</b><small>有運動的天數</small></span></div>
      <div><i class="orb gold"></i><span><b>${w.answeredBoth} 題</b><small>每日一問一起答了</small></span></div>
      <div><i class="orb" style="--c:var(--disgust)"></i><span><b>${money(w.saved)}</b><small>你存進未來（只有你看得到）</small></span></div>
    </div>
    <p class="muted">${[w.photos ? `放了 ${w.photos} 張照片` : "", w.pings ? `互送 ${w.pings} 顆想你` : ""].filter(Boolean).join("、") || "這週辛苦了"}。今天也別忘了到互動頁寫<a href="together/#checkin">每週小聊天</a>。</p>`;
}
// 接下來 30 天：紀念日和旅行放在同一張卡（沒有的時候整張不顯示）
function renderAgenda(s) {
  const el = $("agendaCard"), list = s.agenda || [];
  if (!list.length) { el.hidden = true; return; }
  const md = iso => `${+iso.slice(5, 7)}/${+iso.slice(8)}`;
  el.hidden = false;
  el.innerHTML = `<h2 id="agTitle">接下來 30 天</h2><ul>${list.slice(0, 5).map(x => {
    const trip = x.kind === "trip";
    const href = trip ? `split/#trip-${x.id}` : "together/#days";
    const when = trip ? (x.ongoing ? "旅程進行中" : x.days === 0 ? "今天出發" : `${md(x.date)} 出發`) : md(x.date);
    const n = trip && x.ongoing ? "進行中" : x.days === 0 ? "今天" : `${x.days} 天後`;
    return `<li><a href="${href}"><i class="orb" style="--c:${trip ? "var(--envy,#7BD88F)" : "var(--gold)"}"></i><span class="t">${esc(x.title)}<small>${when}${trip && x.end !== x.date ? `～${md(x.end)}` : ""}</small></span><span class="n">${n}</span></a></li>`;
  }).join("")}</ul>`;
}
// 12 月到 1 月第一週：首頁出現「我們的一年」
function renderYear(s) {
  const el = $("yearCard"), [y, m, d] = s.today.split("-").map(Number);
  const year = m === 12 ? y : m === 1 && d <= 7 ? y - 1 : null;
  if (!year) { el.hidden = true; return; }
  el.hidden = false; el.href = `year/?year=${year}`;
  el.innerHTML = `<i class="orb gold pulse"></i><span><b>我們的 ${year} 年</b><span class="s">照片、問答記憶球、旅程島和做到的事，一起翻翻看</span></span>`;
}

// 想你：對方送來還沒看的愛心會讓這一條亮起來；按愛心送一顆給對方（也會把收到的標成看過）
const hm = iso => new Intl.DateTimeFormat("zh-TW", { timeZone: "Asia/Taipei", hour: "2-digit", minute: "2-digit", hour12: false }).format(new Date(iso));
function renderPing(p) {
  const pa = ME.partner, el = $("pingbar");
  if (!pa || !p) { el.hidden = true; return; }
  el.hidden = false;
  el.classList.toggle("got", p.unseen > 0);
  const sent = p.today[ME.user.id] || 0;
  el.innerHTML = `<div class="t">${p.unseen ? `<b>${esc(pa.name)}想你了 ♥</b><span class="muted">${p.unseen > 1 ? `${p.unseen} 顆，` : ""}${hm(p.last)}。按愛心回一顆</span>`
    : `<b>想${esc(pa.name)}了嗎？</b><span class="muted">${sent ? `今天送了 ${sent} 顆${p.partner_seen ? `・${hm(p.partner_seen)} 看到了` : ""}` : `按一下，${esc(pa.name)}的首頁就會亮起來`}</span>`}</div>
    <button class="heart" type="button" id="pingBtn" aria-label="送一顆想你給${esc(pa.name)}">♥</button>`;
  $("pingBtn").onclick = async () => {
    try {
      if (p.unseen) await FiveJS.api("/api/together/pings/seen", { method: "POST" });
      await FiveJS.api("/api/together/pings", { method: "POST" });
      loadSummary();
    } catch (e) { $("pingbar").querySelector(".t span").textContent = e.message; }
  };
}

async function loadSummary() {
  // 先畫上次的摘要，後端回來再換成最新的
  const c = FiveJS.peek("/api/hq/today");
  if (c && !loadSummary.shown) { loadSummary.shown = true; try { renderConsole(c); renderCore(c); renderShelf(c); renderPing(c.together.ping); } catch (e) {} }
  try {
    const s = await FiveJS.api("/api/hq/today");
    renderConsole(s); renderCore(s); renderShelf(s); renderPing(s.together.ping); renderWeek(s); renderAgenda(s); renderYear(s);
  } catch (e) {
    if (e instanceof FiveJS.AuthError) { FiveJS.setToken(null); showGate(e.message, true); return; }
    // 已經畫了上次的摘要就留著，等下次回到這頁再更新
    if (loadSummary.shown) return;
    renderConsole(null);
    $("shelf").innerHTML = `<p class="small muted">${esc(e.message)}</p>`;
  }
}

function showGate(msg, isErr) {
  document.body.classList.add("locked");
  $("booting").hidden = true; $("hub").hidden = true; $("gate").hidden = false;
  pigs($("gatePigs"), null, null, 110);
  $("gateMsg").hidden = !msg; $("gateMsg").textContent = msg || ""; $("gateMsg").className = isErr ? "msg err" : "msg";
  FiveJS.renderGoogleButton($("googleBtn"), enter, e => {
    // 403：Google 登入成功，但這個帳號不在白名單裡
    showGate(e.message.includes("授權") ? `${e.message}。這個網站只開放給大豬和小豬。` : e.message, true);
  });
}

function enter(me) {
  const next = new URLSearchParams(location.search).get("next");
  if (next && (READY.has(next) || next === "year") && next !== "hq") { location.replace(`${next}/`); return; }
  ME = me;
  document.body.classList.remove("locked");
  $("booting").hidden = true; $("gate").hidden = true; $("hub").hidden = false;
  $("accountName").textContent = me.user.name;
  $("accountName").title = me.user.email;
  pigs($("corePigs"), me.user, me.partner, 68);
  $("helloTitle").textContent = `${greeting()}，${me.user.name}`;
  $("helloDate").textContent = `總部・${todayText()}`;
  renderConsole(null);
  loadSummary();
}

// ---------- 手機推播 ----------
// 每台裝置各自開；iPhone 要先「加入主畫面」，從主畫面打開才有通知權限（iOS 16.4 以上）。
const NOTIF_KINDS = [["answer", "另一半回答了每日一問"], ["ping", "另一半送來「想你」"], ["ledger", "晚上 8 點半還沒記帳"], ["period", "預計經期的前一天"], ["dates", "紀念日前 3 天"]];
const pushOk = () => "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
const isIOS = () => /iPhone|iPad|iPod/.test(navigator.userAgent);
const standalone = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const b64ToBytes = s => { const b = atob((s + "=".repeat((4 - s.length % 4) % 4)).replace(/-/g, "+").replace(/_/g, "/")); return Uint8Array.from(b, c => c.charCodeAt(0)); };
async function currentSub() { if (!pushOk()) return null; const reg = await navigator.serviceWorker.ready; return reg.pushManager.getSubscription(); }
// ---------- App 上鎖（這台裝置自己的 PIN，見 common/lock.js）----------
let lockNote = "";
const lockHtml = () => {
  if (!window.FiveLock?.supported()) return "";
  const on = FiveLock.enabled(), idle = FiveLock.idle();
  const sel = `<label class="small">多久沒用就上鎖 <select id="lkIdle">${FiveLock.IDLE_CHOICES.map(([v, t]) => `<option value="${v}"${v === idle ? " selected" : ""}>${t}</option>`).join("")}</select></label>`;
  const pin = (id, ph) => `<input id="${id}" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" placeholder="${ph}" style="width:7.5em">`;
  return `<hr class="sep"><h2>App 上鎖</h2>
    <p class="muted">${on ? "這台裝置已經上鎖：離開一陣子再回來，要先輸入 PIN。" : "設一組 4 碼 PIN，這台裝置離開一陣子再回來就要輸入。每台裝置各自設定。"}這是擋住旁人隨手翻看的鎖，不是加密；忘記 PIN 的話，登出再用 Google 登入就能重設。</p>
    <div class="rows">${sel}</div>
    ${on ? `<div class="acts">${pin("lkCur", "目前 PIN")}${pin("lkNew", "新 PIN")}<button class="btn" type="button" id="lkChange">改 PIN</button></div>
      <div class="acts" style="margin-top:8px"><button class="btn ghost" type="button" id="lkNow">現在就上鎖</button>${pin("lkOffPin", "輸入 PIN")}<button class="btn ghost" type="button" id="lkOff">關閉上鎖</button></div>`
      : `<div class="acts">${pin("lkNew", "4 碼 PIN")}${pin("lkNew2", "再輸入一次")}<button class="btn primary" type="button" id="lkSet">開啟上鎖</button></div>`}
    <p style="margin-top:8px" id="lkNote"${lockNote ? "" : " hidden"}>${esc(lockNote)}</p>`;
};
function wireLock() {
  if (!window.FiveLock?.supported()) return;
  const say = t => { lockNote = t; renderNotif(); };
  const v = id => ($(id)?.value || "").trim();
  $("lkIdle") && ($("lkIdle").onchange = () => { FiveLock.setIdle(+$("lkIdle").value); });
  $("lkSet") && ($("lkSet").onclick = async () => {
    if (!/^\d{4}$/.test(v("lkNew"))) return say("PIN 要剛好 4 個數字。");
    if (v("lkNew") !== v("lkNew2")) return say("兩次輸入的 PIN 不一樣。");
    await FiveLock.set(v("lkNew"), +$("lkIdle").value); say("開好了。下次離開一陣子再回來就會要求輸入。");
  });
  $("lkChange") && ($("lkChange").onclick = async () => {
    if (!(await FiveLock.verify(v("lkCur")))) return say("目前的 PIN 不對。");
    if (!/^\d{4}$/.test(v("lkNew"))) return say("新 PIN 要剛好 4 個數字。");
    await FiveLock.set(v("lkNew")); say("PIN 已經改好。");
  });
  $("lkOff") && ($("lkOff").onclick = async () => {
    if (!(await FiveLock.verify(v("lkOffPin")))) return say("要先輸入正確的 PIN 才能關閉。");
    FiveLock.disable(); say("已關閉上鎖。");
  });
  $("lkNow") && ($("lkNow").onclick = () => FiveLock.lockNow());
}

// ---------- 全站備份 ----------
const backupHtml = (note) => `<hr class="sep"><h2>備份資料</h2>
  <p class="muted">把你在這個網站的資料整包存成一個檔案：飲食、運動、經期、記帳、分帳，以及互動裡你寫的答案和上傳的照片。別人的記帳和經期不會在你的檔案裡。</p>
  <div class="acts" style="margin-top:8px"><button class="btn" type="button" id="bkAll">下載備份（含照片）</button><button class="btn ghost" type="button" id="bkLite">下載備份（不含照片）</button></div>
  ${note ? `<p style="margin-top:8px" id="bkNote">${esc(note)}</p>` : `<p style="margin-top:8px" id="bkNote" hidden></p>`}
  <p class="small muted" style="margin-top:8px">建議每個月存一次，檔案放在雲端硬碟或寄給自己。含照片的檔案比較大，要等一下。</p>`;
async function downloadBackup(withPhotos) {
  const note = $("bkNote"); note.hidden = false; note.textContent = "整理中，請稍等…";
  $("bkAll").disabled = $("bkLite").disabled = true;
  try {
    const data = await FiveJS.api(`/api/export?photos=${withPhotos ? 1 : 0}`);
    const day = new Date().toLocaleDateString("sv-SE", { timeZone: "Asia/Taipei" });
    const blob = new Blob([JSON.stringify(data)], { type: "application/json" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
    a.download = `大小豬的小空間備份_${data.user?.name || ""}_${day}.json`;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 10000);
    note.textContent = `已下載（${(blob.size / 1048576).toFixed(1)} MB）。`;
  } catch (e) { note.textContent = `備份失敗：${e.message || e}`; }
  finally { $("bkAll").disabled = $("bkLite").disabled = false; }
}
const wireBackup = () => { $("bkAll") && ($("bkAll").onclick = () => downloadBackup(true)); $("bkLite") && ($("bkLite").onclick = () => downloadBackup(false)); };

// 排程有沒有在動：保活排程正常是每 10 分鐘一次，所以最近 1 小時約 6 次（這個數字只算後端這次開機之後的）
function schedHtml(sc) {
  if (!sc) return "";
  const young = sc.uptimeMin < 60, ok = sc.pingsLastHour >= 4;
  const text = young ? `後端剛啟動 ${sc.uptimeMin} 分鐘，還看不出排程有沒有在跑，過一小時再來看。`
    : ok ? `排程正常：最近 1 小時被呼叫了 ${sc.pingsLastHour} 次。`
    : `排程可能停了：最近 1 小時只被呼叫 ${sc.pingsLastHour} 次（正常約 6 次）。請到 cron-job.org 確認那個排程還在跑。`;
  return `<p class="small ${young || ok ? "muted" : ""}" style="margin-top:6px${young || ok ? "" : ";color:var(--disgust,#e36)"}">${esc(text)}</p>`;
}
async function renderNotif(msg) {
  const el = $("notif");
  let html = `<h2 id="notifTitle">手機通知</h2>`;
  if (!pushOk()) {
    html += `<p class="muted">${isIOS() && !standalone() ? "iPhone 要先把這個網站「加入主畫面」（分享 → 加入主畫面），再從主畫面的圖示打開，才能開通知。需要 iOS 16.4 以上。" : "這個瀏覽器不支援網頁通知。"}</p>` + lockHtml() + backupHtml();
    el.innerHTML = html; wireLock(); wireBackup(); return;
  }
  const sub = await currentSub().catch(() => null);
  let prefs = null, sched = null;
  try { const r = await FiveJS.api("/api/push/prefs"); prefs = r.prefs; sched = r.schedule; } catch (e) {}
  const denied = Notification.permission === "denied";
  html += sub
    ? `<p>這台裝置已經開啟通知。</p>`
    : `<p class="muted">${denied ? "通知被這個瀏覽器封鎖了，要到瀏覽器（或手機設定）的網站權限裡允許通知。" : "開啟後，這台裝置會收到下面勾選的提醒。每台手機或電腦要各自開。"}</p>`;
  if (prefs) html += `<div class="rows">${NOTIF_KINDS.map(([k, t]) => `<label><input type="checkbox" data-pref="${k}"${prefs[k] ? " checked" : ""}>${t}</label>`).join("")}</div>`;
  html += `<div class="acts">${sub ? `<button class="btn" type="button" id="pushTest">傳一則測試通知</button><button class="btn ghost" type="button" id="pushOff">關閉這台的通知</button>`
    : denied ? "" : `<button class="btn primary" type="button" id="pushOn">開啟這台裝置的通知</button>`}</div>
    ${msg ? `<p style="margin-top:8px">${esc(msg)}</p>` : ""}
    <p class="small muted" style="margin-top:8px">定時提醒（記帳、經期、紀念日）要靠每 10 分鐘的保活呼叫帶動，時間可能晚幾分鐘。</p>${schedHtml(sched)}` + lockHtml() + backupHtml();
  el.innerHTML = html; wireLock(); wireBackup();
  $("pushOn") && ($("pushOn").onclick = enablePush);
  $("pushOff") && ($("pushOff").onclick = disablePush);
  $("pushTest") && ($("pushTest").onclick = async () => { try { await FiveJS.api("/api/push/test", { method: "POST" }); renderNotif("送出了，幾秒內應該會收到。"); } catch (e) { renderNotif(e.message); } });
}
async function enablePush() {
  try {
    if (await Notification.requestPermission() !== "granted") return renderNotif("沒有允許通知，所以沒有開啟。");
    const { publicKey } = await FiveJS.api("/api/push/key");
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToBytes(publicKey) });
    await FiveJS.api("/api/push/subscribe", { method: "POST", body: sub.toJSON() });
    renderNotif("開好了！可以按「傳一則測試通知」試試看。");
  } catch (e) { renderNotif(`開啟失敗：${e.message || e}`); }
}
async function disablePush() {
  try {
    const sub = await currentSub();
    if (sub) { await FiveJS.api("/api/push/unsubscribe", { method: "POST", body: { endpoint: sub.endpoint } }).catch(() => {}); await sub.unsubscribe(); }
    renderNotif("這台裝置不會再收到通知。");
  } catch (e) { renderNotif(e.message); }
}
$("notifBtn").onclick = () => {
  const el = $("notif"), open = el.hidden;
  el.hidden = !open; $("notifBtn").setAttribute("aria-expanded", String(open));
  if (open) { lockNote = ""; el.innerHTML = `<p class="small muted">讀取中…</p>`; renderNotif(); }
};
$("notif").addEventListener("change", async e => {
  const c = e.target.closest("[data-pref]"); if (!c) return;
  try { await FiveJS.api("/api/push/prefs", { method: "PUT", body: { [c.dataset.pref]: c.checked } }); } catch (err) { c.checked = !c.checked; }
});

$("logoutBtn").onclick = async () => { await FiveJS.logout(); showGate("已登出。"); };
document.addEventListener("visibilitychange", () => { if (!document.hidden && ME) loadSummary(); });

async function boot() {
  // 先叫醒後端；超過 3 秒還沒回應，多半是 Render 剛好在休眠，提示一下
  const slow = setTimeout(() => { $("bootMsg").textContent = "正在叫醒後端，第一次打開可能要等一分鐘…"; }, 3000);
  const woke = FiveJS.wake();
  if (!FiveJS.getToken()) { await woke; clearTimeout(slow); showGate(); return; }
  // 登入過就先用上次的身分進總部，背景再跟後端確認
  const prev = FiveJS.cachedMe();
  if (prev?.user) {
    clearTimeout(slow);
    enter(prev);
    FiveJS.status().catch(e => { if (e instanceof FiveJS.AuthError) { FiveJS.setToken(null); showGate(e.message, true); } });
    return;
  }
  try { enter(await FiveJS.status()); }
  catch (e) {
    // 連不上後端不代表登入失效，保留 token，重新整理就會再試一次
    if (e instanceof FiveJS.AuthError) { FiveJS.setToken(null); showGate(e.message, true); }
    else { $("booting").hidden = false; $("bootMsg").textContent = `${e.message}（重新整理頁面再試一次）`; }
  } finally { clearTimeout(slow); }
}
boot();
})();
</script>
</body>
</html>

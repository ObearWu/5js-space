<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>大小豬的小空間</title>
<meta name="theme-color" content="#FFF5F2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="大小豬">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Huninn&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="common/style.css">
<script src="https://accounts.google.com/gsi/client" async></script>
<style>
.gate{max-width:440px;width:100%;margin:8vh auto 0;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
.gate .pigs .lollipop{width:96px;height:96px}
.gate h2{font-size:1.4rem}
#googleBtn{min-height:44px}

.hello{display:flex;align-items:center;gap:14px}
.hello .pigs .lollipop{width:72px;height:72px}
.hello h2{font-size:1.35rem}
.hello p{margin:2px 0 0;color:var(--muted)}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:16px}
.card{position:relative;display:flex;gap:14px;align-items:flex-start;padding:18px;background:var(--surface);border:2px solid var(--line);border-radius:var(--r);box-shadow:0 6px 0 var(--shadow);color:inherit;text-decoration:none;transition:transform .12s,border-color .12s}
a.card:hover{border-color:var(--accent);transform:translateY(-2px)}
a.card:active{transform:translateY(2px);box-shadow:0 2px 0 var(--shadow)}
.card .ic{flex:none;width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-deep)}
.card .ic svg{width:28px;height:28px}
.card h3{font-size:1.1rem}
.card p{margin:4px 0 0;font-size:.88rem;color:var(--muted);line-height:1.5}
.card .path{font-family:var(--f-num);font-size:.78rem;color:var(--muted)}
.card.soon{opacity:.72;cursor:default}
.card.soon .ic{background:var(--sunk);color:var(--muted)}
.badge{position:absolute;top:12px;right:12px;font-size:.72rem;font-weight:700;padding:1px 9px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;font-size:.8rem;color:var(--muted);padding-top:8px;border-top:2px dashed var(--line)}
</style>
</head>
<body>
<div class="page">
  <header class="top">
    <a class="brand" href="./">
      <span class="pigs" id="brandPigs"></span>
      <span><h1>大小豬的小空間</h1><p>吃飯、記帳、生活，兩個人一起記</p></span>
    </a>
    <div id="account" hidden>
      <span class="small muted" id="accountName"></span>
      <button class="btn ghost" type="button" id="logoutBtn">登出</button>
    </div>
  </header>

  <section class="gate" id="gate" hidden>
    <span class="pigs" id="gatePigs"></span>
    <h2>嗨，請先登入</h2>
    <p class="muted">這裡只有大豬和小豬兩個人能進來，請用你們的 Google 帳號登入。</p>
    <div id="googleBtn"></div>
    <p class="msg" id="gateMsg" hidden></p>
  </section>

  <main id="hub" hidden>
    <div style="display:flex;flex-direction:column;gap:20px">
      <section class="hello">
        <span class="pigs" id="helloPigs"></span>
        <div><h2 id="helloTitle"></h2><p id="helloDate"></p></div>
      </section>
      <nav class="cards" id="cards" aria-label="功能"></nav>
    </div>
  </main>

  <p class="loading" id="booting"><span class="spinner"></span><span id="bootMsg">讀取中…</span></p>

  <footer class="foot">
    <span>大小豬的小空間</span>
  </footer>
</div>

<script src="common/config.js"></script>
<script src="common/auth.js"></script>
<script src="common/mascot.js"></script>
<script>
(() => {
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// 五個功能。ready 為 false 的顯示「製作中」、不能點；做好一個就改成 true。
const ICON = {
  food: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11h16a8 8 0 0 1-16 0z"/><path d="M8 7c0-1.5 1-2 1-3.5M12 7c0-1.5 1-2 1-3.5M16 7c0-1.5 1-2 1-3.5"/></svg>',
  split: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18M16 15h2"/></svg>',
  period: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c3 4 6 7.5 6 11a6 6 0 0 1-12 0c0-3.5 3-7 6-11z"/></svg>',
  together: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"/></svg>',
  fitness: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8v8M18 8v8M3 10v4M21 10v4M6 12h12"/></svg>',
};
const MODULES = [
  { key: "food", name: "飲食", desc: "拍照或打字，AI 估熱量與營養，記錄三餐、喝水與腸道", ready: true },
  { key: "split", name: "分帳", desc: "記下誰付了什麼，隨時知道誰欠誰多少", ready: true },
  { key: "period", name: "月經", desc: "經期、症狀與心情，預測下一次", ready: true },
  { key: "together", name: "互動", desc: "每日一問、心情打卡、照片牆、紀念日倒數", ready: true },
  { key: "fitness", name: "運動", desc: "運動紀錄、重訓組數與體重曲線", ready: true },
];

function greeting() {
  const h = Number(new Intl.DateTimeFormat("en-US", { timeZone: "Asia/Taipei", hour: "numeric", hour12: false }).format(new Date()));
  return h < 5 ? "還沒睡呀" : h < 11 ? "早安" : h < 14 ? "午安" : h < 18 ? "下午好" : "晚安";
}
function todayText() {
  return new Intl.DateTimeFormat("zh-TW", { timeZone: "Asia/Taipei", month: "long", day: "numeric", weekday: "long" }).format(new Date());
}
function pigs(el, me, partner, size) {
  const a = me?.theme || "blue", b = partner?.theme || (a === "blue" ? "pink" : "blue");
  el.innerHTML = FiveJS.lollipop(a, "happy", size) + FiveJS.lollipop(b, "wave", Math.round(size * .8));
}

function renderCards() {
  $("cards").innerHTML = MODULES.map(m => m.ready
    ? `<a class="card" href="${m.key}/"><span class="ic">${ICON[m.key]}</span><span><h3>${m.name}</h3><p>${m.desc}</p><span class="path">/${m.key}</span></span></a>`
    : `<div class="card soon" aria-disabled="true"><span class="badge">製作中</span><span class="ic">${ICON[m.key]}</span><span><h3>${m.name}</h3><p>${m.desc}</p><span class="path">/${m.key}</span></span></div>`
  ).join("");
}

function showGate(msg, isErr) {
  $("booting").hidden = true; $("hub").hidden = true; $("account").hidden = true; $("gate").hidden = false;
  pigs($("gatePigs"), null, null, 96);
  $("gateMsg").hidden = !msg; $("gateMsg").textContent = msg || ""; $("gateMsg").className = isErr ? "msg err" : "msg";
  FiveJS.renderGoogleButton($("googleBtn"), enter, e => {
    // 403：Google 登入成功，但這個帳號不在白名單裡
    showGate(e.message.includes("授權") ? `${e.message}。這個網站只開放給大豬和小豬。` : e.message, true);
  });
}

function enter(me) {
  const next = new URLSearchParams(location.search).get("next");
  const target = MODULES.find(m => m.key === next && m.ready);
  if (target) { location.replace(`${target.key}/`); return; }
  $("booting").hidden = true; $("gate").hidden = true; $("hub").hidden = false; $("account").hidden = false;
  $("accountName").textContent = `${me.user.name}・${me.user.email}`;
  pigs($("brandPigs"), me.user, me.partner, 44);
  pigs($("helloPigs"), me.user, me.partner, 72);
  $("helloTitle").textContent = `${greeting()}，${me.user.name}！今天想記什麼？`;
  $("helloDate").textContent = todayText();
  renderCards();
}

$("logoutBtn").onclick = async () => { await FiveJS.logout(); showGate("已登出。"); };

async function boot() {
  pigs($("brandPigs"), FiveJS.cachedMe()?.user, FiveJS.cachedMe()?.partner, 44);
  // 先叫醒後端；超過 3 秒還沒回應，多半是 Render 剛好在休眠，提示一下
  const slow = setTimeout(() => { $("bootMsg").textContent = "正在叫醒後端，第一次打開可能要等一分鐘…"; }, 3000);
  const woke = FiveJS.wake();
  if (!FiveJS.getToken()) { await woke; clearTimeout(slow); showGate(); return; }
  try { enter(await FiveJS.status()); }
  catch (e) {
    // 連不上後端不代表登入失效，保留 token，重新整理就會再試一次
    if (e instanceof FiveJS.AuthError) { FiveJS.setToken(null); showGate(e.message, true); }
    else { $("booting").hidden = false; $("bootMsg").textContent = `${e.message}（重新整理頁面再試一次）`; }
  } finally { clearTimeout(slow); }
}
boot();
})();
</script>
</body>
</html>
